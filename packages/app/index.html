<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Chess Civilization</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Цвета берутся из темы Telegram (переменные --tg-theme-*), вне Telegram — запасные значения. */
    :root {
      --bg: var(--tg-theme-bg-color, #f3f1ec);
      --card: var(--tg-theme-secondary-bg-color, #ffffff);
      --ink: var(--tg-theme-text-color, #1d1b18);
      --muted: var(--tg-theme-hint-color, #6f6a62);
      --accent: var(--tg-theme-button-color, #2f6f4f);
      --accent-ink: var(--tg-theme-button-text-color, #ffffff);
      --line: color-mix(in srgb, var(--muted) 30%, transparent);
      --good: #2f8a57; --warn: #b4841c; --bad: #b5452f;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not(.tg) { --bg: #151714; --card: #1f221e; --ink: #ecebe6; --muted: #9c9a92; --accent: #5fae84; --accent-ink: #0d1410; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
    body { font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
    h1 { font-size: 22px; margin: 4px 0 2px; }
    h2 { font-size: 16px; margin: 0 0 10px; }
    p { margin: 0 0 10px; }
    .muted { color: var(--muted); font-size: 13px; }
    .stack { display: flex; flex-direction: column; gap: 12px; max-width: 560px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 12px; padding: 14px; }
    button { font: inherit; border: 0; border-radius: 10px; padding: 12px 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; width: 100%; cursor: pointer; }
    button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); font-weight: 500; }
    button:disabled { opacity: .5; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pick { margin: 14px 0 6px; font-size: 17px; }
    .pick .muted { font-weight: 500; }
    .nations { display: flex; gap: 0; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0; margin: 0 0 6px; -webkit-overflow-scrolling: touch; scrollbar-width: none; overscroll-behavior-x: contain; }
    .nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
    .nav button { width: 44px; padding: 6px 0; font-size: 22px; line-height: 1; }
    .nations::-webkit-scrollbar { display: none; }
    .nations .nation { flex: 0 0 100%; width: 100%; box-sizing: border-box; scroll-snap-align: start; scroll-snap-stop: always; gap: 4px; padding: 16px; min-height: 196px; align-items: center; text-align: center; }
    .nation .flag { border-radius: 3px; margin-bottom: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    .nation { display: flex; flex-direction: column; justify-content: flex-start; text-align: left; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); font-weight: 400; }
    .nation.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .nation b { display: block; font-size: 15px; }
    .nation span { display: block; font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 2px; }
    .nation small { display: block; font-size: 12px; line-height: 1.35; color: var(--muted); margin-top: 4px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
    td, th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
    td.n, th.n { text-align: right; }
    th { color: var(--muted); font-weight: 500; }
    .ok { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
    .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .log { font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; }

    /* ---- экран партии: карта на весь экран, панель снизу ---- */
    body.game { padding: 0; height: 100dvh; overflow: hidden; }
    .game-root { display: flex; flex-direction: column; height: 100dvh; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--line); }
    .res { display: flex; gap: 12px; flex: 1; flex-wrap: wrap; font-variant-numeric: tabular-nums; font-weight: 600; align-items: center; }
    .res span { display: inline-flex; align-items: center; gap: 4px; }
    .res small { font-weight: 400; color: var(--muted); font-size: 11px; }
    .res small.neg { color: var(--bad); }
    .res .turn { color: var(--muted); font-weight: 500; }
    .ico { flex: none; display: block; }
    .withico { display: inline-flex; align-items: center; gap: 6px; }
    .amt { display: inline-flex; align-items: center; gap: 2px; font-style: normal; white-space: nowrap; vertical-align: -2px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot.wood { background: #7a5a33; } .dot.food { background: #7fa83a; } .dot.gold { background: #d9a520; }
    .end { width: auto; padding: 9px 14px; }
    .mapwrap { flex: 1; min-height: 0; position: relative; background: #2a2e2a; }
    #map { width: 100%; height: 100%; display: block; touch-action: none; }
    .sheet { max-height: 42dvh; overflow-y: auto; padding: 12px 12px calc(14px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
    .cellhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin-top: 6px; }
    button.act { text-align: left; padding: 8px 10px; font-weight: 400; background: var(--card); color: var(--ink); border: 1px solid var(--line); }
    button.act b { display: block; font-size: 14px; color: var(--accent); }
    button.act span { display: block; font-size: 11.5px; color: var(--muted); }
    .card p { margin: 4px 0 0; }
    .aibanner { position: fixed; left: 50%; transform: translateX(-50%); top: 62px; background: rgba(20,20,20,.82); color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 13px; z-index: 5; white-space: nowrap; }
    .aibanner[hidden] { display: none; }
    .toast { position: fixed; left: 12px; right: 12px; top: 56px; background: rgba(20,20,20,.88); color: #fff; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; z-index: 5; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; z-index: 6; }
    .modal[hidden] { display: none; }
    .dialog { background: var(--bg); width: 100%; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; gap: 8px; }

    /* ---- бой ---- */
    .fight { position: fixed; inset: 0; z-index: 8; background: var(--bg); overflow-y: auto; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
    .fhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .fhead b { font-size: 17px; }
    .fhead span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .fside { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
    .fside .mat { font-size: 16px; letter-spacing: 1px; white-space: nowrap; }
    #boardhost { display: flex; justify-content: center; }
    .board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: min(100%, 58vh); aspect-ratio: 1; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.25); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .sq { position: relative; display: flex; align-items: center; justify-content: center; }
    .sq.l { background: #eadfc8; } .sq.d { background: #a9825f; }
    .sq.last::before { content: ''; position: absolute; inset: 0; background: rgba(240, 200, 40, .38); }
    .sq.sel::before { content: ''; position: absolute; inset: 0; background: rgba(60, 140, 220, .45); }
    .sq.check::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgba(230,30,30,.85) 0%, rgba(230,30,30,.35) 55%, transparent 75%); }
    .sq.tgt::after { content: ''; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(20, 60, 30, .38); }
    .sq.cap::after { content: ''; position: absolute; inset: 4%; border-radius: 50%; border: 4px solid rgba(20, 60, 30, .4); }
    .sq .cf, .sq .cr { position: absolute; font-style: normal; font-size: 9px; font-weight: 600; opacity: .7; pointer-events: none; }
    .sq .cf { right: 2px; bottom: 1px; } .sq .cr { left: 2px; top: 1px; }
    .sq.l .cf, .sq.l .cr { color: #a9825f; } .sq.d .cf, .sq.d .cr { color: #eadfc8; }
    .pc { position: relative; z-index: 1; font-size: var(--pc, 32px); line-height: 1; font-family: "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", serif; pointer-events: none; }
    .pc.w { color: #fbfaf5; text-shadow: 0 1px 1px rgba(0,0,0,.2); }
    .pc.w::after { content: attr(data-o); position: absolute; left: 0; top: 0; color: #2b2b28; text-shadow: none; } /* контур белой фигуры */
    .pc.b { color: #262624; text-shadow: 0 1px 0 rgba(255,255,255,.25); }
    .tutorial { position: fixed; left: 10px; right: 10px; top: 58px; z-index: 5; background: var(--bg); border: 1.5px solid var(--accent); border-radius: 12px; padding: 10px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.25); font-size: 14px; }
    .tutorial p { margin: 0 0 8px; }
    .trow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .tbtn { width: auto; padding: 6px 12px; font-size: 13px; margin-left: 6px; }
    button.act.off { opacity: .55; }
    .hirehead { margin: 8px 0 0; font-size: 13px; }
    .ptask { margin: 0; font-size: 15px; }
    .good { color: #2e7d4f; }
    .fstatus { min-height: 20px; font-size: 14px; margin: 0; }
    .fmoves { min-height: 18px; font-size: 13px; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }
    .fight.replay .acts { grid-template-columns: repeat(5, 1fr) 1.6fr; }
    .fight.replay .acts button b { font-size: 16px; }
    .promo { position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; }
    .promo[hidden] { display: none; }
    .promo div { display: flex; gap: 10px; }
    .promo button { --pc: 44px; width: 64px; height: 64px; border-radius: 12px; background: #eadfc8; border: 0; display: flex; align-items: center; justify-content: center; pointer-events: auto; font-size: 44px; }
  </style>
  <script>
    // Автообновление: если вышла новая версия, а Telegram показал старую страницу из кеша — перезагрузить
    (function () {
      var cur = '__BUNDLE__';
      fetch('version.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
        if (!v.bundle || v.bundle === cur) return;
        var key = 'cc-reload-' + v.bundle;
        try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) { return; }
        var q = new URLSearchParams(location.search); q.set('v', v.bundle);
        location.replace(location.pathname + '?' + q.toString() + location.hash);
      }).catch(function () {});
    })();
  </script>
</head>
<body>
  <main id="app" class="stack"><p class="muted">Loading…</p></main>
  <script type="module" src="./app.js"></script>
</body>
</html>
