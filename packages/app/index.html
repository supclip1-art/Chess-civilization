<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Chess Civilization</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* без двойного тапа-зума и без масштабирования страницы щипком: зумится только карта (#map) */
    :where(*) { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    /* Цвета берутся из темы Telegram (переменные --tg-theme-*), вне Telegram — запасные значения. */
    :root {
      --bg: var(--tg-theme-bg-color, #f3f1ec);
      --card: var(--tg-theme-secondary-bg-color, #ffffff);
      --ink: var(--tg-theme-text-color, #1d1b18);
      --muted: var(--tg-theme-hint-color, #6f6a62);
      --accent: var(--tg-theme-button-color, #2f6f4f);
      --accent-ink: var(--tg-theme-button-text-color, #ffffff);
      --line: color-mix(in srgb, var(--muted) 30%, transparent);
      --good: #2f8a57; --warn: #b4841c; --bad: #b5452f;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not(.tg) { --bg: #151714; --card: #1f221e; --ink: #ecebe6; --muted: #9c9a92; --accent: #5fae84; --accent-ink: #0d1410; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
    body { font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
    h1 { font-size: 22px; margin: 4px 0 2px; }
    h2 { font-size: 16px; margin: 0 0 10px; }
    p { margin: 0 0 10px; }
    .muted { color: var(--muted); font-size: 13px; }
    .stack { display: flex; flex-direction: column; gap: 12px; max-width: 560px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 12px; padding: 14px; }
    button { font: inherit; border: 0; border-radius: 10px; padding: 12px 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; width: 100%; cursor: pointer; }
    button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); font-weight: 500; }
    button:disabled { opacity: .5; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pick { margin: 14px 0 6px; font-size: 17px; }
    .pick .muted { font-weight: 500; }
    .nations { display: flex; gap: 0; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0; margin: 0 0 6px; -webkit-overflow-scrolling: touch; scrollbar-width: none; overscroll-behavior-x: contain; }
    .nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
    .nav button { width: 44px; padding: 6px 0; font-size: 22px; line-height: 1; }
    .nations::-webkit-scrollbar { display: none; }
    .nations .nation { flex: 0 0 100%; width: 100%; box-sizing: border-box; scroll-snap-align: start; scroll-snap-stop: always; gap: 4px; padding: 16px; min-height: 196px; align-items: center; text-align: center; }
    .nation .flag { border-radius: 3px; margin-bottom: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    .nation { display: flex; flex-direction: column; justify-content: flex-start; text-align: left; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); font-weight: 400; }
    .nation.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .nation b { display: block; font-size: 15px; }
    .nation span { display: block; font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 2px; }
    .nation small { display: block; font-size: 12px; line-height: 1.35; color: var(--muted); margin-top: 4px; }
    /* ---------- главный экран ---------- */
    .hero { position: relative; margin: -16px -16px 0; height: min(64vh, 420px); overflow: hidden; border-radius: 0 0 26px 26px; background: #2b2f5a; }
    .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .herotext { position: absolute; left: 22px; right: 22px; top: calc(20px + env(safe-area-inset-top, 0px)); color: #fbf3e2; text-shadow: 0 2px 14px rgba(20, 18, 60, .55); }
    .wordmark { font-family: 'Cinzel', 'Trajan Pro', Georgia, serif; font-weight: 700; font-size: clamp(32px, 9.5vw, 46px); line-height: 1.02; letter-spacing: .02em; margin: 0 0 8px; }
    .herotext p { margin: 0; font-size: 14px; line-height: 1.4; max-width: 19em; color: #f6e7c8; }
    .homebody { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 12px; margin-top: -30px; }
    .hello { margin: 0 4px; color: var(--muted); font-size: 14px; order: 9; }
    .contcard { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 18px; background: var(--card); box-shadow: 0 8px 24px rgba(40, 30, 70, .2); }
    .contflag svg { display: block; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
    .conttext { flex: 1; min-width: 0; } .conttext b { display: block; font-size: 16px; } .conttext small { color: var(--muted); font-size: 12.5px; } .conttext small span { white-space: nowrap; }
    button.contbtn { flex: none; width: auto; padding: 12px 20px; border-radius: 12px; }
    button.playbtn { padding: 17px; border-radius: 18px; font-family: 'Cinzel', Georgia, serif; font-size: 19px; font-weight: 700; letter-spacing: .04em; color: #3a2604;
      background: linear-gradient(#f6cf6a, #d89e2c); border: 1px solid #b07b18; box-shadow: 0 4px 0 #94650f, 0 12px 24px rgba(160, 105, 20, .35); transition: transform .08s, box-shadow .08s; }
    button.playbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #94650f, 0 6px 12px rgba(160, 105, 20, .3); }
    button.playbtn.second { font-size: 16px; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); box-shadow: none; }
    .dynnext { font-size: 12px; color: #6b5320; }
    .homerow { display: flex; gap: 10px; } .homerow button { flex: 1; }
    .settings { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: var(--card); }
    .settings[hidden] { display: none; }
    .settings p { margin: 0; }
    @media (min-width: 600px) { .hero { border-radius: 0 0 26px 26px; } }
    /* ---------- династия ---------- */
    .nation.locked { opacity: .55; } .nation .lock { display: block; font-style: normal; font-size: 12px; font-weight: 600; color: var(--warn); margin-top: 6px; }
    .seg button:disabled { opacity: .5; }
    .dynbtn { display: flex; align-items: center; gap: 12px; text-align: left; background: linear-gradient(135deg, #f7e7b4, #e9c66b); color: #3b2a08; border: 1px solid #c99b2e; }
    .dyncrest { flex: none; width: 38px; height: 42px; display: grid; place-items: center; font-weight: 800; font-size: 17px; color: #fff8e1;
      background: linear-gradient(#b8862a, #7c5413); clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%); }
    .dyncrest.big { width: 52px; height: 58px; font-size: 22px; }
    .dyntext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; } .dyntext b { font-size: 15px; }
    .dynbtn .muted { color: #6b5320; }
    .xpbar { height: 7px; border-radius: 4px; background: color-mix(in srgb, #7c5413 22%, transparent); overflow: hidden; }
    .xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #d9a632, #f4d57a); border-radius: 4px; }
    .dynhead { display: flex; align-items: center; gap: 14px; }
    .lvrow { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); opacity: .6; }
    .lvrow.open { opacity: 1; } .lvrow b { display: block; }
    .lvnum { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--line); }
    .lvrow.open .lvnum { background: #d9a632; color: #fff; } .lvrow.cur .lvnum { box-shadow: 0 0 0 3px color-mix(in srgb, #d9a632 40%, transparent); }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; }
    .chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
    .chip.ck-nation { border-color: color-mix(in srgb, var(--accent) 50%, transparent); } .chip.ck-map { border-color: #4a6488; } .chip.ck-bonus { border-color: #b4841c; }
    #dynbody h2 { margin: 14px 0 8px; }
    #dyntabs button { flex: 1 1 0; min-width: 0; font-size: 13px; padding: 9px 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .looks { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
    .looktile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); font-weight: 400; }
    .looktile.on { border-color: #d9a632; box-shadow: inset 0 0 0 1px #d9a632; } .looktile:disabled { opacity: .45; }
    .looktile b { font-size: 13px; } .looktile small { font-size: 11px; color: var(--muted); }
    .lookpcs { display: flex; border-radius: 6px; padding: 2px 4px; } .lookpcs .pc { position: relative; display: inline-block; width: 34px; height: 34px; }
    .lookboard { display: grid; grid-template-columns: 1fr 1fr; width: 40px; height: 40px; border-radius: 5px; overflow: hidden; }
    .lookboard i:nth-child(1), .lookboard i:nth-child(4) { background: var(--l); } .lookboard i:nth-child(2), .lookboard i:nth-child(3) { background: var(--d); }
    .bonuses { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .bonus { text-align: left; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); font-weight: 400; }
    .bonus.on { border-color: #d9a632; } .bonus:disabled { opacity: .45; } .bonus b { display: block; font-size: 14px; } .bonus small { color: var(--muted); font-size: 12px; }
    .achlist { display: flex; flex-direction: column; gap: 6px; }
    .ach { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--card); opacity: .6; }
    .ach.got { opacity: 1; background: linear-gradient(135deg, color-mix(in srgb, #f4d57a 35%, var(--card)), var(--card)); }
    .ach div { flex: 1; } .ach b { display: block; font-size: 14px; } .ach small { color: var(--muted); font-size: 12px; }
    .medal { font-size: 22px; color: var(--muted); } .ach.got .medal { color: #d9a632; } .axp { font-size: 12px; font-weight: 700; color: #b4841c; }
    .achv { position: fixed; z-index: 60; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translate(-50%, -140%); transition: transform .35s cubic-bezier(.2,.9,.3,1.2);
      display: flex; align-items: center; gap: 10px; width: min(92vw, 380px); padding: 10px 14px; border-radius: 14px; color: #3b2a08;
      background: linear-gradient(135deg, #fbefc4, #e9c66b); border: 1px solid #c99b2e; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    .achv.in { transform: translate(-50%, 0); }
    .achv div { display: flex; flex-direction: column; } .achv b { font-size: 16px; } .achv small { font-size: 12px; color: #6b5320; }
    .achstar { font-size: 30px; color: #a8741a; text-shadow: 0 0 10px #fff3c4; }
    .sumdyn table { width: 100%; } .sumdyn .tot td { font-weight: 700; border-top: 1px solid var(--line); }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .soundrow button { flex: 1; }
    .soon { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 2; max-width: calc(100% - 20px); display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: rgba(20,20,20,.74); color: #fff; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .soon[hidden] { display: none; } .soon b { color: #f3d27a; font-weight: 600; } .soon svg { flex: none; }
    /* сундук трофеев */
    .chest { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 4px; text-align: center; }
    .chestbox { position: relative; animation: chestshake .55s ease-in-out; }
    .chestbox::before { content: ''; position: absolute; left: 50%; top: 40%; width: 230px; height: 230px; transform: translate(-50%, -50%) scale(0); border-radius: 50%;
      background: radial-gradient(circle, rgba(255,226,140,.95) 0%, rgba(255,210,90,.35) 40%, rgba(255,210,90,0) 70%); animation: chestglow .7s .5s ease-out forwards; z-index: -1; }
    .chest.rare .chestbox::before { background: radial-gradient(circle, rgba(170,210,255,.95) 0%, rgba(120,170,255,.35) 40%, rgba(120,170,255,0) 70%); }
    .chest.epic .chestbox::before { background: radial-gradient(circle, rgba(220,170,255,.95) 0%, rgba(190,120,255,.4) 40%, rgba(190,120,255,0) 70%); }
    .chestbox .lid { transform-origin: 18px 46px; animation: chestlid .45s .5s ease-out forwards; }
    .chestprize { display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: 0; transform: translateY(10px) scale(.9); animation: chestprize .45s .85s ease-out forwards; }
    .chestprize .prizeico { display: inline-flex; gap: 6px; align-items: center; } .chestprize b { font-size: 18px; } .chestprize small { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
    .chest.rare .chestprize small { color: #3d7bd6; } .chest.epic .chestprize small { color: #8e44d6; }
    .chestpiece { font-size: 44px; line-height: 1; }
    @keyframes chestshake { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-6deg); } 40% { transform: rotate(5deg); } 60% { transform: rotate(-4deg); } 80% { transform: rotate(3deg); } }
    @keyframes chestlid { to { transform: rotate(-38deg) translate(-4px, -6px); } }
    @keyframes chestglow { to { transform: translate(-50%, -50%) scale(1); } }
    @keyframes chestprize { to { opacity: 1; transform: none; } }
    .evcard { text-align: center; } .evcard h2 { margin: 8px 0 4px; } .evcard p { margin: 0 0 6px; }
    .evart { display: inline-flex; animation: evpop .45s ease-out; } @keyframes evpop { from { transform: scale(.6) rotate(-8deg); opacity: 0; } }
    .stance { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: #e3efe3; color: #2d6a3e; white-space: nowrap; }
    .stance.war { background: #f8dcd6; color: #a3321f; } .stance.ally { background: #dbe7f8; color: #2a5ea8; }
    .diplo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .diprow { display: flex; align-items: center; gap: 8px; background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 7px 10px; font-weight: 400; text-align: left; }
    .diprow b { flex: 1; font-weight: 600; } .diprow .flag { border-radius: 2px; }
    #vassalsbtn { top: calc(60px + var(--toast, 0px)); padding: 6px 12px 6px 9px; }
    .vassal .row { justify-content: flex-start; gap: 8px; } .vassal .row .muted { margin-left: auto; font-size: 12px; }
    .seg.wide { width: 100%; } .seg.wide button { flex: 1; }
    .dres { display: flex; align-items: center; gap: 6px; margin: 4px 0; } .dres b { min-width: 34px; } .dres small { flex: 1; font-size: 11.5px; }
    .dres span { display: flex; gap: 4px; } button.mini { width: auto; padding: 4px 7px; font-size: 12px; font-weight: 600; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    button.chip { width: auto; padding: 5px 10px; font-size: 12.5px; font-weight: 500; border-radius: 999px; background: var(--card); color: var(--ink); border: 1px solid var(--line); }
    button.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .dchance { margin: 10px 0 4px; } .dchance .good { color: #2d8a4e; } .dchance .mid { color: #c48a12; } .dchance .bad { color: #c0392b; }
    .traits { display: flex; flex-direction: column; gap: 4px; margin: 4px 0 6px; }
    .trait { font-size: 12.5px; color: var(--muted); padding: 4px 9px; border-radius: 8px; background: rgba(227,179,65,.14); border-left: 3px solid #e3b341; }
    .trait b { color: var(--ink); font-weight: 600; }
    .seg { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    .seg button { width: auto; border-radius: 0; padding: 7px 14px; background: var(--bg); color: var(--ink); font-weight: 500; }
    .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
    td, th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
    td.n, th.n { text-align: right; }
    th { color: var(--muted); font-weight: 500; }
    .ok { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
    .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .log { font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; }

    /* ---- экран партии: карта на весь экран, панель снизу ---- */
    body.game { padding: 0; height: 100dvh; overflow: hidden; }
    .game-root { display: flex; flex-direction: column; height: 100dvh; }
    .bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px 8px 6px; background: var(--card); border-bottom: 1px solid var(--line); }
    .res { display: flex; gap: 9px; flex: 1; min-width: 0; flex-wrap: nowrap; font-size: 14.5px; font-variant-numeric: tabular-nums; font-weight: 600; align-items: center; }
    .res span { display: inline-flex; align-items: center; gap: 4px; }
    .res small { font-weight: 400; color: var(--muted); font-size: 10.5px; }
    .res small.neg { color: var(--bad); }
    .mebtn { width: 40px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; flex: none; }
    .mebtn .flag { border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.2), 0 1px 3px rgba(0,0,0,.3); }
    .natbtn { width: auto; padding: 2px 4px; margin-left: 8px; background: transparent; border: 1px solid var(--line); border-radius: 6px; display: inline-flex; vertical-align: middle; }
    .natbtn .flag { display: block; border-radius: 2px; }
    .nation-head { display: flex; gap: 12px; align-items: center; }
    .nation-head h2 { margin: 0 0 2px; } .nation-head p { margin: 0; font-size: 13px; }
    .nation-head .flag { flex: none; border-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
    .ruler { display: flex; gap: 12px; align-items: center; margin: 14px 0; }
    .ruler .portrait { flex: none; } .ruler b { font-size: 17px; } .ruler p { margin: 2px 0 0; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .stats div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; }
    .stats span { font-size: 12px; color: var(--muted); } .stats b { font-size: 20px; font-variant-numeric: tabular-nums; } .stats small { font-size: 11.5px; color: var(--muted); }
    .tree { position: relative; margin: 6px 0 10px; }
    .treelines { position: absolute; inset: 0; width: 100%; height: 100%; }
    .treelines path { fill: none; stroke: var(--line); stroke-width: 4; stroke-linecap: round; }
    .treelines path.lit { stroke: #e3b341; }
    .treehead { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; position: relative; z-index: 1; }
    .tnode { position: absolute; transform: translate(-50%, -50%); width: 96px; padding: 0; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink); font-weight: 600; font-size: 12.5px; }
    .tnode .techicon { width: 50px; height: 50px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); transition: transform .15s; }
    .tnode.locked .techicon { filter: grayscale(1) opacity(.45); }
    .tnode.open .techicon { animation: glow 1.6s ease-in-out infinite; }
    .tnode.picked .techicon { transform: scale(1.12); }
    .tnode.picked span { color: var(--accent); }
    .tnode .tick { position: absolute; top: -2px; right: 16px; font-style: normal; font-size: 12px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #2e8b57; color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
    .tnode .tick.busy { background: #e3b341; } .tnode .tick.lock { background: var(--card); font-size: 10px; }
    @keyframes glow { 50% { filter: drop-shadow(0 0 8px rgba(227,179,65,.95)); } }
    .techinfo { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
